name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only. Nothing in CI publishes anything.
permissions:
  contents: read

# A newer push to the same branch makes the run in progress pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            web/package-lock.json

      - name: Install
        run: |
          npm ci
          npm --prefix server ci
          npm --prefix web ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build the frontend
        run: npm run build

  image:
    name: Build the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # amd64 only here. The release workflow does the slow multi-arch build;
      # this one only has to prove the Dockerfile still works.
      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: drydock:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check it starts and answers
        run: |
          docker run -d --name drydock-ci -p 8787:8787 drydock:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/health > /tmp/health.json; then
              echo "healthy after ${i}s"
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          echo "the container never became healthy"
          docker logs drydock-ci
          exit 1

      - name: Container logs on failure
        if: failure()
        run: docker logs drydock-ci || true
